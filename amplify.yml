version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10.28.0
        - pnpm install
    build:
      commands:
        - pnpm run build
        - echo "Build completed successfully"
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  customHeaders:
    - pattern: "/api/**"
      headers:
        - key: "Cache-Control"
          value: "no-cache, no-store, must-revalidate"
